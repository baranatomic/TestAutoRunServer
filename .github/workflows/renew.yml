name: Katabump Auto Renew

on:

  schedule:
    - cron: '0 12 */3 * *'

  workflow_dispatch:

    inputs:

      server_key:
        description: 'Server key'
        required: false
        default: 'main'
        type: string


jobs:

  renew-job:

    runs-on: ubuntu-latest

    timeout-minutes: 15


    steps:

      - name: Checkout

        uses: actions/checkout@v4


      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: '3.11'


      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install playwright requests

          playwright install --with-deps chromium


      - name: Run Katabump Renew

        env:

          SERVER_KEY: ${{ github.event.inputs.server_key || 'main' }}

          KATABUMP_SERVERS_JSON: ${{ secrets.KATABUMP_SERVERS_JSON }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}

          WORKER_URL: ${{ secrets.WORKER_URL }}

          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}


        run: |

          python renew.py


      - name: Upload Debug

        if: failure()

        uses: actions/upload-artifact@v4

        with:

          name: katabump-debug

          path: |

            *.png

            *.html
