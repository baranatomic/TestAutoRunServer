name: Katabump Auto Renew

on:

  schedule:
    - cron: '0 12 */3 * *'

  workflow_dispatch:
    inputs:

      server_key:
        description: 'Server key to renew, or all'
        required: false
        default: 'all'
        type: string

      run_id:
        description: 'Internal run ID'
        required: false
        default: ''
        type: string


jobs:

  renew-job:

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:


      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout

        uses: actions/checkout@v4


      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: '3.11'


      # ======================================================
      # Dependencies
      # ======================================================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install playwright requests

          playwright install --with-deps chromium


      # ======================================================
      # Renew
      # ======================================================

      - name: Run Katabump Renew

        env:

          WORKER_URL: ${{ secrets.WORKER_URL }}

          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}

          SERVER_KEY: ${{ github.event.inputs.server_key || 'all' }}

          RUN_ID: ${{ github.event.inputs.run_id || github.run_id }}


        run: |

          python renew.py


      # ======================================================
      # Debug files on failure
      # ======================================================

      - name: Upload Debug

        if: failure()

        uses: actions/upload-artifact@v4

        with:

          name: katabump-debug-${{ github.run_id }}

          path: |

            *.png

            *.html

          if-no-files-found: ignore
